<!-- ⚡ ID CARD ELECTRIC SPARKS -->

<rect
  x="430"
  y="122"
  width="356"
  height="410"
  rx="28"
  fill="none"
  stroke="url(#electricRGB)"
  stroke-width="3"
  stroke-dasharray="3 12 1 22"
  stroke-linecap="round"
  filter="url(#electricGlow)">

  <animate
    attributeName="stroke-dashoffset"
    values="0;-80;0"
    dur="1.4s"
    repeatCount="indefinite"/>

  <animate
    attributeName="opacity"
    values=".45;1;.5;1;.45"
    dur="1s"
    repeatCount="indefinite"/>
</rect>

<!-- Bright electric streak -->
<rect
  x="430"
  y="122"
  width="356"
  height="410"
  rx="28"
  fill="none"
  stroke="#ffffff"
  stroke-width="1.5"
  stroke-dasharray="2 65"
  stroke-linecap="round"
  filter="url(#electricGlow)">

  <animate
    attributeName="stroke-dashoffset"
    from="0"
    to="-270"
    dur="1s"
    repeatCount="indefinite"/>
</rect>
