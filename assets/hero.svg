<svg width="1200" height="540" viewBox="0 0 1200 540"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">

  <defs>

    <!-- =========================
         BACKGROUND
    ========================== -->
    <radialGradient id="bgGlow" cx="70%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#101b38"/>
      <stop offset="45%" stop-color="#070d1d"/>
      <stop offset="100%" stop-color="#030711"/>
    </radialGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#4d6b9d" opacity=".28"/>
    </pattern>

    <!-- =========================
         RGB BORDER GRADIENT
    ========================== -->
    <linearGradient id="rgbBorder"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00eaff">
        <animate attributeName="stop-color"
                 values="#00eaff;#7c3cff;#ff00a8;#00eaff"
                 dur="5s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="35%" stop-color="#7c3cff">
        <animate attributeName="stop-color"
                 values="#7c3cff;#ff00a8;#00eaff;#7c3cff"
                 dur="5s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="70%" stop-color="#ff00a8">
        <animate attributeName="stop-color"
                 values="#ff00a8;#00eaff;#7c3cff;#ff00a8"
                 dur="5s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#00eaff">
        <animate attributeName="stop-color"
                 values="#00eaff;#ff00a8;#7c3cff;#00eaff"
                 dur="5s"
                 repeatCount="indefinite"/>
      </stop>

      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        from="0 600 270"
        to="360 600 270"
        dur="7s"
        repeatCount="indefinite"/>
    </linearGradient>

    <!-- =========================
         ID CARD RGB GRADIENT
    ========================== -->
    <linearGradient id="cardRGB"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%" stop-color="#00eaff">
        <animate attributeName="stop-color"
                 values="#00eaff;#0066ff;#8b5cf6;#ff00c8;#00eaff"
                 dur="4s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color"
                 values="#8b5cf6;#ff00c8;#00eaff;#0066ff;#8b5cf6"
                 dur="4s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#ff00c8">
        <animate attributeName="stop-color"
                 values="#ff00c8;#00eaff;#0066ff;#8b5cf6;#ff00c8"
                 dur="4s"
                 repeatCount="indefinite"/>
      </stop>

      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        from="0 980 270"
        to="360 980 270"
        dur="6s"
        repeatCount="indefinite"/>
    </linearGradient>

    <!-- =========================
         GLOWS
    ========================== -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- =========================
         CLIP FOR ID CARD IMAGE
    ========================== -->
    <clipPath id="cardImageClip">
      <rect x="922" y="151" width="222" height="184" rx="12"/>
    </clipPath>

  </defs>


  <!-- =========================================================
       MAIN BACKGROUND
  ========================================================== -->

  <rect width="1200" height="540" fill="#030711"/>

  <rect width="1200"
        height="540"
        fill="url(#bgGlow)"/>

  <rect width="1200"
        height="540"
        fill="url(#grid)"
        opacity=".75"/>


  <!-- =========================================================
       BACKGROUND RGB LIGHT
  ========================================================== -->

  <ellipse cx="950"
           cy="275"
           rx="280"
           ry="240"
           fill="#0066ff"
           opacity=".08"
           filter="url(#softGlow)">
    <animate attributeName="opacity"
             values=".04;.12;.05;.10;.04"
             dur="4s"
             repeatCount="indefinite"/>
  </ellipse>


  <!-- =========================================================
       MAIN HERO RGB BORDER
  ========================================================== -->

  <rect x="22"
        y="22"
        width="1156"
        height="496"
        rx="34"
        fill="none"
        stroke="#00eaff"
        stroke-width="14"
        opacity=".12"
        filter="url(#softGlow)"/>

  <rect x="22"
        y="22"
        width="1156"
        height="496"
        rx="34"
        fill="none"
        stroke="url(#rgbBorder)"
        stroke-width="2.5"/>


  <!-- =========================================================
       TOP LEFT
  ========================================================== -->

  <text x="62"
        y="72"
        fill="#28dfff"
        font-family="monospace"
        font-size="15"
        letter-spacing="1.5">
    HELLO, WORLD_
  </text>

  <text x="62"
        y="122"
        fill="#ffffff"
        opacity=".9"
        font-family="monospace"
        font-size="17">
    I’m
  </text>


  <!-- =========================================================
       NAME
  ========================================================== -->

  <text x="60"
        y="190"
        fill="#f5f7ff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="66"
        font-weight="900"
        letter-spacing="1">
    ABHISHEK
  </text>

  <text x="60"
        y="255"
        fill="#f5f7ff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="66"
        font-weight="900"
        letter-spacing="1">
    KUMAR
  </text>


  <!-- =========================================================
       ROLE LABEL
  ========================================================== -->

  <text x="63"
        y="292"
        fill="#8da2c7"
        font-family="monospace"
        font-size="14"
        letter-spacing="1">
    CSE STUDENT  ·  FULL-STACK BUILDER  ·  AI / CLOUD EXPLORER
  </text>


  <!-- =========================================================
       READ ME TYPING SVG
  ========================================================== -->

  <image
    x="60"
    y="315"
    width="650"
    height="55"
    preserveAspectRatio="xMinYMid meet"
    href="https://readme-typing-svg.demolab.com/?font=Orbitron%26weight=600%26size=26%26pause=900%26color=7DF9FF%26center=false%26vCenter=true%26width=900%26height=66%26lines=Frontend%20or%20full-stack%20engineer;Btech%20CSE%20student%20at%20Parul%20University.;Building%20with%20TypeScript%20%C2%B7%20HTML%20%C2%B7%20CSS;Always%20coding%20%C2%B7%20learning%20%C2%B7%20shipping%20%F0%9F%9A%80"
  />


  <!-- =========================================================
       DESCRIPTION
  ========================================================== -->

  <text x="63"
        y="400"
        fill="#e7ecff"
        font-family="monospace"
        font-size="15">
    Building useful software where AI, automation
  </text>

  <text x="63"
        y="423"
        fill="#e7ecff"
        font-family="monospace"
        font-size="15">
    and developer experience meet.
  </text>


  <!-- =========================================================
       LOCATION / UNIVERSITY
  ========================================================== -->

  <circle cx="69"
          cy="465"
          r="4"
          fill="#00eaff"
          filter="url(#smallGlow)">
    <animate attributeName="r"
             values="3;6;3"
             dur="1.8s"
             repeatCount="indefinite"/>
  </circle>

  <text x="82"
        y="470"
        fill="#9cb0d2"
        font-family="monospace"
        font-size="13">
    Vadodara, Gujarat, India
  </text>

  <text x="285"
        y="470"
        fill="#566987"
        font-family="monospace"
        font-size="13">
    ▣
  </text>

  <text x="304"
        y="470"
        fill="#9cb0d2"
        font-family="monospace"
        font-size="13">
    Parul University
  </text>


  <!-- =========================================================
       RIGHT SIDE — ID CARD RGB FRAME
  ========================================================== -->

  <!-- Outer glow -->
  <rect x="825"
        y="61"
        width="335"
        height="418"
        rx="30"
        fill="none"
        stroke="url(#cardRGB)"
        stroke-width="12"
        opacity=".18"
        filter="url(#softGlow)"/>

  <!-- Card -->
  <rect x="825"
        y="61"
        width="335"
        height="418"
        rx="30"
        fill="#081224"
        stroke="url(#cardRGB)"
        stroke-width="2.5"/>


  <!-- =========================================================
       CARD HEADER
  ========================================================== -->

  <rect x="846"
        y="80"
        width="293"
        height="34"
        rx="10"
        fill="#101d36"/>

  <text x="862"
        y="102"
        fill="#39dfff"
        font-family="monospace"
        font-size="10"
        letter-spacing=".7">
    PARUL UNIVERSITY · CSE
  </text>

  <text x="1062"
        y="102"
        fill="#91a6cb"
        font-family="monospace"
        font-size="9">
    PROFILE ID 01
  </text>


  <!-- =========================================================
       ID CARD PHOTO
       Replace the href with your actual image if required.
  ========================================================== -->

  <rect x="910"
        y="140"
        width="246"
        height="205"
        rx="15"
        fill="#020712"
        stroke="#142644"
        stroke-width="1"/>

  <image
    x="922"
    y="151"
    width="222"
    height="184"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#cardImageClip)"
    href="./assets/profile-id-card.png"/>


  <!-- Photo RGB scan -->
  <rect x="922"
        y="151"
        width="222"
        height="3"
        rx="2"
        fill="#00eaff"
        opacity=".8"
        filter="url(#smallGlow)">

    <animate attributeName="y"
             values="151;332;151"
             dur="3.2s"
             repeatCount="indefinite"/>
  </rect>


  <!-- =========================================================
       CARD NAME
  ========================================================== -->

  <text x="860"
        y="392"
        fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        font-weight="900"
        letter-spacing=".4">
    ABHISHEK KUMAR
  </text>

  <text x="860"
        y="415"
        fill="#7df9ff"
        font-family="monospace"
        font-size="11">
    B.Tech CSE · Full-Stack / AI / Cloud
  </text>


  <!-- =========================================================
       CARD FOOTER
  ========================================================== -->

  <line x1="860"
        y1="435"
        x2="1125"
        y2="435"
        stroke="#263957"
        stroke-width="1"/>

  <text x="860"
        y="457"
        fill="#65799c"
        font-family="monospace"
        font-size="9">
    SOFTWARE ENGINEER
  </text>

  <text x="1040"
        y="457"
        fill="#39dfff"
        font-family="monospace"
        font-size="9">
    ● ONLINE
  </text>


  <!-- =========================================================
       FLOATING RGB PARTICLES
  ========================================================== -->

  <circle cx="790"
          cy="85"
          r="2"
          fill="#00eaff">
    <animate attributeName="cy"
             values="85;55;85"
             dur="2.4s"
             repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values=".2;1;.2"
             dur="2.4s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="1180"
          cy="400"
          r="2"
          fill="#ff00c8">
    <animate attributeName="cx"
             values="1180;1155;1180"
             dur="3s"
             repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values=".2;1;.2"
             dur="3s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="790"
          cy="450"
          r="2"
          fill="#7c3cff">
    <animate attributeName="cy"
             values="450;420;450"
             dur="2.7s"
             repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values=".2;1;.2"
             dur="2.7s"
             repeatCount="indefinite"/>
  </circle>


  <!-- =========================================================
       BOTTOM STATUS LINE
  ========================================================== -->

  <text x="63"
        y="505"
        fill="#405473"
        font-family="monospace"
        font-size="9"
        letter-spacing="1">
    SYSTEM_STATUS :: BUILDING · LEARNING · SHIPPING
  </text>

  <circle cx="500"
          cy="502"
          r="3"
          fill="#00ffb3">
    <animate attributeName="opacity"
             values="1;.2;1"
             dur="1.2s"
             repeatCount="indefinite"/>
  </circle>

</svg>
