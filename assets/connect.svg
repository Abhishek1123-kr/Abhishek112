<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1200"
  height="560"
  viewBox="0 0 1200 560"
  role="img"
  aria-label="Abhishek Kumar connect"
>

  <defs>

    <!-- Main gradient -->
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#247bff"/>
      <stop offset=".55" stop-color="#425eff"/>
      <stop offset="1" stop-color="#ff354f"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="glow">
      <stop stop-color="#247bff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#247bff" stop-opacity="0"/>
    </radialGradient>

    <!-- Background dots -->
    <pattern
      id="dots"
      width="18"
      height="18"
      patternUnits="userSpaceOnUse"
    >
      <circle
        cx="2"
        cy="2"
        r="1"
        fill="#8da0c2"
        opacity=".15"
      />
    </pattern>

    <!-- Clip profile image -->
    <clipPath id="profileClip">
      <rect
        x="75"
        y="150"
        width="400"
        height="335"
        rx="22"
      />
    </clipPath>

  </defs>


  <!-- ========================= -->
  <!-- BACKGROUND -->
  <!-- ========================= -->

  <rect
    width="1200"
    height="560"
    rx="34"
    fill="#070b16"
  />

  <rect
    width="1200"
    height="560"
    fill="url(#dots)"
  />


  <!-- ========================= -->
  <!-- HEADER -->
  <!-- ========================= -->

  <text
    x="70"
    y="70"
    fill="#f7f8fb"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="-1"
  >
    CONNECT / NEXT
  </text>

  <text
    x="70"
    y="98"
    fill="#aab3c4"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
  >
    Say hello, explore my work, or follow the build.
  </text>


  <!-- ========================= -->
  <!-- LEFT PROFILE CARD -->
  <!-- ========================= -->

  <g>

    <!-- Card -->
    <rect
      x="50"
      y="125"
      width="450"
      height="385"
      rx="30"
      fill="#0b1120"
      stroke="url(#grad)"
      stroke-width="1.5"
    />

    <!-- Profile image background -->
    <rect
      x="75"
      y="150"
      width="400"
      height="335"
      rx="22"
      fill="#101a2e"
    />

    <!-- PROFILE IMAGE -->
    <!-- IMPORTANT:
         Put profile2.png inside:
         public/assets/profile2.png

         Then this URL will work in Vite/React.
    -->

<image
  x="75"
  y="175"
  width="400"
  height="310"
  preserveAspectRatio="xMidYMid slice"
  href="https://raw.githubusercontent.com/Abhishek1123-kr/Abhishek1123-kr/main/assets/profile2.png"
  xlink:href="https://raw.githubusercontent.com/Abhishek1123-kr/Abhishek1123-kr/main/assets/profile2.png"
  clip-path="url(#profileClip)"
/>

    <!-- Image border -->
    <rect
      x="75"
      y="150"
      width="400"
      height="335"
      rx="22"
      fill="none"
      stroke="#263149"
      stroke-width="1"
    />

  </g>


  <!-- ========================= -->
  <!-- CONNECTION LINE -->
  <!-- ========================= -->

  <path
    d="M445 318 C495 300 530 300 560 300"
    fill="none"
    stroke="#247bff"
    stroke-width="2"
    stroke-dasharray="7 9"
  />

  <path
    d="M548 290 L566 300 L548 310"
    fill="none"
    stroke="#247bff"
    stroke-width="2"
  />


  <!-- ========================= -->
  <!-- RIGHT SIDE -->
  <!-- ========================= -->

  <g
    font-family="Arial, Helvetica, sans-serif"
    fill="#f7f8fb"
  >

    <!-- ========================= -->
    <!-- GITHUB -->
    <!-- ========================= -->

    <g transform="translate(580 145)">

      <rect
        width="510"
        height="72"
        rx="22"
        fill="#0b1120"
        stroke="#263149"
      />

      <circle
        cx="38"
        cy="36"
        r="20"
        fill="#101a2e"
      />

      <text
        x="38"
        y="42"
        text-anchor="middle"
        font-size="13"
        font-weight="700"
      >
        GH
      </text>

      <text
        x="78"
        y="32"
        font-size="16"
        font-weight="700"
      >
        GitHub
      </text>

      <text
        x="78"
        y="52"
        fill="#aab3c4"
        font-size="12"
      >
        github.com/Abhishek1123-kr
      </text>

    </g>


    <!-- ========================= -->
    <!-- LINKEDIN -->
    <!-- ========================= -->

    <g transform="translate(580 235)">

      <rect
        width="510"
        height="72"
        rx="22"
        fill="#0b1120"
        stroke="#263149"
      />

      <circle
        cx="38"
        cy="36"
        r="20"
        fill="#101a2e"
      />

      <text
        x="38"
        y="42"
        text-anchor="middle"
        font-size="13"
        font-weight="700"
      >
        in
      </text>

      <text
        x="78"
        y="32"
        font-size="16"
        font-weight="700"
      >
        LinkedIn
      </text>

      <text
        x="78"
        y="52"
        fill="#aab3c4"
        font-size="12"
      >
        linkedin.com/in/abhishek1123-kr
      </text>

    </g>


    <!-- ========================= -->
    <!-- LEETCODE -->
    <!-- ========================= -->

    <g transform="translate(580 325)">

      <rect
        width="510"
        height="72"
        rx="22"
        fill="#0b1120"
        stroke="#263149"
      />

      <circle
        cx="38"
        cy="36"
        r="20"
        fill="#101a2e"
      />

      <text
        x="38"
        y="42"
        text-anchor="middle"
        font-size="13"
        font-weight="700"
      >
        LC
      </text>

      <text
        x="78"
        y="32"
        font-size="16"
        font-weight="700"
      >
        LeetCode
      </text>

      <text
        x="78"
        y="52"
        fill="#aab3c4"
        font-size="12"
      >
        leetcode.com/u/Abhishek1123-kr
      </text>

    </g>


    <!-- ========================= -->
    <!-- PORTFOLIO -->
    <!-- ========================= -->

    <g transform="translate(580 415)">

      <rect
        width="510"
        height="72"
        rx="22"
        fill="#0b1120"
        stroke="#263149"
      />

      <circle
        cx="38"
        cy="36"
        r="20"
        fill="#101a2e"
      />

      <text
        x="38"
        y="42"
        text-anchor="middle"
        font-size="11"
        font-weight="700"
      >
        WEB
      </text>

      <text
        x="78"
        y="32"
        font-size="16"
        font-weight="700"
      >
        Portfolio
      </text>

      <text
        x="78"
        y="52"
        fill="#aab3c4"
        font-size="12"
      >
        abhishekkumar-1123.vercel.app
      </text>

    </g>

  </g>

</svg>
