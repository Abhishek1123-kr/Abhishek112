<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1200"
  height="520"
  viewBox="0 0 1200 520"
  role="img"
  aria-label="Abhishek Kumar about and projects"
>

  <defs>

    <!-- RGB Animated Gradient for Box Border -->
    <linearGradient id="rgbBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%">
        <animate attributeName="stop-color"
          values="#ff0055;#00f2fe;#4facfe;#00ff88;#f093fb;#ff0055"
          dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%">
        <animate attributeName="stop-color"
          values="#7928ca;#4facfe;#00ff88;#f093fb;#ff0055;#7928ca"
          dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%">
        <animate attributeName="stop-color"
          values="#0070f3;#00ff88;#f093fb;#ff0055;#7928ca;#0070f3"
          dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%">
        <animate attributeName="stop-color"
          values="#00dfd8;#f093fb;#ff0055;#7928ca;#0070f3;#00dfd8"
          dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color"
          values="#ff0055;#00f2fe;#4facfe;#00ff88;#f093fb;#ff0055"
          dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- RGB Glow Filter -->
    <filter id="rgbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background dots -->
    <pattern
      id="dots"
      width="18"
      height="18"
      patternUnits="userSpaceOnUse"
    >
      <circle
        cx="2"
        cy="2"
        r="1"
        fill="#8da0c2"
        opacity=".15"
      />
    </pattern>

  </defs>

  <style>
    .project-card {
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.22s ease, filter 0.22s ease;
    }
    .project-card:hover {
      transform: translateX(5px);
      filter: drop-shadow(0 4px 14px rgba(36, 123, 255, 0.4));
    }
    .project-card:hover .card-rect {
      fill: #121c36;
      stroke: #00f2fe;
      stroke-width: 1.4;
    }
    .project-card:hover .ext-arrow {
      fill: #00f2fe;
      transform: translate(3px, -3px);
    }
    .ext-arrow {
      transition: transform 0.22s ease, fill 0.22s ease;
    }
    .skill-row {
      transition: transform 0.2s ease;
    }
    .skill-row:hover {
      transform: translateX(4px);
    }
  </style>

  <!-- ========================= -->
  <!-- BACKGROUND -->
  <!-- ========================= -->

  <rect
    width="1200"
    height="520"
    rx="34"
    fill="#070b16"
  />

  <rect
    width="1200"
    height="520"
    fill="url(#dots)"
  />

  <!-- ========================= -->
  <!-- HEADER -->
  <!-- ========================= -->

  <text
    x="60"
    y="68"
    fill="#f7f8fb"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="40"
    font-weight="800"
    letter-spacing="-1"
  >
    ABOUT / LIFE
  </text>

  <text
    x="60"
    y="96"
    fill="#8da0c2"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="14"
  >
    Core capabilities on the left · Featured project repositories on the right.
  </text>

  <!-- ============================================== -->
  <!-- LEFT BOX: CAPABILITIES (RGB ANIMATED BORDER) -->
  <!-- ============================================== -->

  <g id="capabilitiesBox">

    <!-- Outer RGB Neon Glow Blur Layer -->
    <rect
      x="60"
      y="125"
      width="490"
      height="350"
      rx="26"
      fill="none"
      stroke="url(#rgbBorder)"
      stroke-width="5"
      filter="url(#rgbGlow)"
      opacity="0.65"
    />

    <!-- Main Card Background -->
    <rect
      x="60"
      y="125"
      width="490"
      height="350"
      rx="26"
      fill="#0b1120"
      stroke="url(#rgbBorder)"
      stroke-width="2.2"
    />

    <!-- Header badge -->
    <g transform="translate(88 152)">
      <circle cx="5" cy="5" r="4" fill="#00f2fe">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text
        x="18"
        y="9"
        fill="#00f2fe"
        font-family="'SF Mono', Consolas, 'Fira Code', monospace"
        font-size="12"
        font-weight="700"
        letter-spacing="1.5"
      >
        CORE CAPABILITIES
      </text>
    </g>

    <!-- Skill Rows -->
    <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

      <!-- 1. BUILD -->
      <g class="skill-row" transform="translate(88 196)">
        <rect width="64" height="24" rx="7" fill="#0070f3" fill-opacity="0.15" stroke="#0070f3" stroke-opacity="0.4"/>
        <text x="32" y="16" text-anchor="middle" fill="#4facfe" font-size="11" font-weight="700">BUILD</text>
        <text x="78" y="17" fill="#e2e8f0" font-size="13.5" font-weight="500">React · TypeScript · Node.js · Python · Java</text>
      </g>

      <!-- 2. DATA -->
      <g class="skill-row" transform="translate(88 244)">
        <rect width="64" height="24" rx="7" fill="#7928ca" fill-opacity="0.15" stroke="#7928ca" stroke-opacity="0.4"/>
        <text x="32" y="16" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="700">DATA</text>
        <text x="78" y="17" fill="#e2e8f0" font-size="13.5" font-weight="500">SQL · PostgreSQL · Supabase · Firebase</text>
      </g>

      <!-- 3. CLOUD -->
      <g class="skill-row" transform="translate(88 292)">
        <rect width="64" height="24" rx="7" fill="#00dfd8" fill-opacity="0.15" stroke="#00dfd8" stroke-opacity="0.4"/>
        <text x="32" y="16" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">CLOUD</text>
        <text x="78" y="17" fill="#e2e8f0" font-size="13.5" font-weight="500">AWS · Google Cloud · Docker · Linux</text>
      </g>

      <!-- 4. AI -->
      <g class="skill-row" transform="translate(88 340)">
        <rect width="64" height="24" rx="7" fill="#ff0055" fill-opacity="0.15" stroke="#ff0055" stroke-opacity="0.4"/>
        <text x="32" y="16" text-anchor="middle" fill="#ff4d88" font-size="11" font-weight="700">AI</text>
        <text x="78" y="17" fill="#e2e8f0" font-size="13" font-weight="500">AI Agents · Local LLMs · Computer Vision</text>
      </g>

      <!-- 5. SHIP -->
      <g class="skill-row" transform="translate(88 388)">
        <rect width="64" height="24" rx="7" fill="#00ff88" fill-opacity="0.15" stroke="#00ff88" stroke-opacity="0.4"/>
        <text x="32" y="16" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="700">SHIP</text>
        <text x="78" y="17" fill="#e2e8f0" font-size="13.5" font-weight="500">Git · GitHub · Vite · Tailwind · Postman</text>
      </g>

    </g>

    <!-- Bottom summary quote -->
    <text
      x="88"
      y="446"
      fill="#64748b"
      font-family="'SF Mono', Consolas, 'Fira Code', monospace"
      font-size="11"
    >
      STATUS :: Actively building, exploring &amp; shipping software.
    </text>

  </g>

  <!-- ============================================== -->
  <!-- RIGHT BOX: FEATURED PROJECTS (RGB ANIMATED BORDER) -->
  <!-- ============================================== -->

  <g id="projectsBox">

    <!-- Outer RGB Neon Glow Blur Layer -->
    <rect
      x="580"
      y="125"
      width="560"
      height="350"
      rx="26"
      fill="none"
      stroke="url(#rgbBorder)"
      stroke-width="5"
      filter="url(#rgbGlow)"
      opacity="0.65"
    />

    <!-- Main Card Background -->
    <rect
      x="580"
      y="125"
      width="560"
      height="350"
      rx="26"
      fill="#0b1120"
      stroke="url(#rgbBorder)"
      stroke-width="2.2"
    />

    <!-- Header badge -->
    <g transform="translate(606 152)">
      <circle cx="5" cy="5" r="4" fill="#ff0055">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <text
        x="18"
        y="9"
        fill="#ff354f"
        font-family="'SF Mono', Consolas, 'Fira Code', monospace"
        font-size="12"
        font-weight="700"
        letter-spacing="1.5"
      >
        FEATURED PROJECTS (CLICK TO OPEN)
      </text>
    </g>

    <!-- ============================================== -->
    <!-- 1. PROJECT: STUDYHUB (CLICKABLE) -->
    <!-- ============================================== -->
    <a
      href="https://github.com/Abhishek1123-kr/STUDYHUB"
      target="_blank"
      rel="noopener noreferrer"
      class="project-card"
    >
      <g transform="translate(606 172)">

        <!-- Row Box -->
        <rect
          class="card-rect"
          width="508"
          height="58"
          rx="16"
          fill="#0f172a"
          stroke="#1e293b"
          stroke-width="1.2"
        />

        <!-- Icon badge -->
        <circle cx="32" cy="29" r="18" fill="#247bff" fill-opacity="0.15" stroke="#247bff" stroke-opacity="0.5"/>
        <!-- Book/Study Vector Icon -->
        <g transform="translate(22 19)" fill="#38bdf8">
          <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/>
        </g>

        <!-- Project Title -->
        <text
          x="62"
          y="24"
          fill="#f8fafc"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="15"
          font-weight="700"
        >
          STUDYHUB
        </text>

        <!-- Tag badge -->
        <rect x="156" y="12" width="62" height="17" rx="5" fill="#247bff" fill-opacity="0.2"/>
        <text x="187" y="24" text-anchor="middle" fill="#60a5fa" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="600">Platform</text>

        <!-- Description -->
        <text
          x="62"
          y="43"
          fill="#94a3b8"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="12"
        >
          Student-first study platform for semester notes, labs &amp; syllabus
        </text>

        <!-- External link arrow -->
        <g class="ext-arrow" transform="translate(476 21)" fill="#64748b">
          <path d="M5 2h9a1 1 0 0 1 1 1v9a1 1 0 1 1-2 0V5.414l-8.293 8.293a1 1 0 0 1-1.414-1.414L11.586 4H5a1 1 0 0 1 0-2z"/>
        </g>

      </g>
    </a>

    <!-- ============================================== -->
    <!-- 2. PROJECT: Journal (CLICKABLE) -->
    <!-- ============================================== -->
    <a
      href="https://github.com/Abhishek1123-kr/Journal"
      target="_blank"
      rel="noopener noreferrer"
      class="project-card"
    >
      <g transform="translate(606 238)">

        <!-- Row Box -->
        <rect
          class="card-rect"
          width="508"
          height="58"
          rx="16"
          fill="#0f172a"
          stroke="#1e293b"
          stroke-width="1.2"
        />

        <!-- Icon badge -->
        <circle cx="32" cy="29" r="18" fill="#7928ca" fill-opacity="0.15" stroke="#7928ca" stroke-opacity="0.5"/>
        <!-- Journal/Notebook Vector Icon -->
        <g transform="translate(22 19)" fill="#c084fc">
          <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
        </g>

        <!-- Project Title -->
        <text
          x="62"
          y="24"
          fill="#f8fafc"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="15"
          font-weight="700"
        >
          Journal
        </text>

        <!-- Tag badge -->
        <rect x="126" y="12" width="80" height="17" rx="5" fill="#7928ca" fill-opacity="0.2"/>
        <text x="166" y="24" text-anchor="middle" fill="#c084fc" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="600">Productivity</text>

        <!-- Description -->
        <text
          x="62"
          y="43"
          fill="#94a3b8"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="12"
        >
          Personal daily logging, thoughts, productivity &amp; life tracker
        </text>

        <!-- External link arrow -->
        <g class="ext-arrow" transform="translate(476 21)" fill="#64748b">
          <path d="M5 2h9a1 1 0 0 1 1 1v9a1 1 0 1 1-2 0V5.414l-8.293 8.293a1 1 0 0 1-1.414-1.414L11.586 4H5a1 1 0 0 1 0-2z"/>
        </g>

      </g>
    </a>

    <!-- ============================================== -->
    <!-- 3. PROJECT: Avic_AI_Friend (CLICKABLE) -->
    <!-- ============================================== -->
    <a
      href="https://github.com/Abhishek1123-kr/Avic_AI_Friend"
      target="_blank"
      rel="noopener noreferrer"
      class="project-card"
    >
      <g transform="translate(606 304)">

        <!-- Row Box -->
        <rect
          class="card-rect"
          width="508"
          height="58"
          rx="16"
          fill="#0f172a"
          stroke="#1e293b"
          stroke-width="1.2"
        />

        <!-- Icon badge -->
        <circle cx="32" cy="29" r="18" fill="#ff0055" fill-opacity="0.15" stroke="#ff0055" stroke-opacity="0.5"/>
        <!-- AI Robot / Companion Vector Icon -->
        <g transform="translate(22 19)" fill="#ff4d88">
          <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.38-1 1.72V7h2a5 5 0 0 1 5 5v1h1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-1v1a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5v-1H3a2 2 0 0 1-2-2v-2c0-1.1.9-2 2-2h1v-1a5 5 0 0 1 5-5h2V5.72A2 2 0 0 1 12 2zm-3 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>
        </g>

        <!-- Project Title -->
        <text
          x="62"
          y="24"
          fill="#f8fafc"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="15"
          font-weight="700"
        >
          Avic AI Friend
        </text>

        <!-- Tag badge -->
        <rect x="172" y="12" width="62" height="17" rx="5" fill="#ff0055" fill-opacity="0.2"/>
        <text x="203" y="24" text-anchor="middle" fill="#ff4d88" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="600">AI Agent</text>

        <!-- Description -->
        <text
          x="62"
          y="43"
          fill="#94a3b8"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="12"
        >
          Context-aware AI virtual companion with conversational memory &amp; vision
        </text>

        <!-- External link arrow -->
        <g class="ext-arrow" transform="translate(476 21)" fill="#64748b">
          <path d="M5 2h9a1 1 0 0 1 1 1v9a1 1 0 1 1-2 0V5.414l-8.293 8.293a1 1 0 0 1-1.414-1.414L11.586 4H5a1 1 0 0 1 0-2z"/>
        </g>

      </g>
    </a>

    <!-- ============================================== -->
    <!-- 4. PROJECT: Smart-India-Hackathon-2026 (CLICKABLE) -->
    <!-- ============================================== -->
    <a
      href="https://github.com/Abhishek1123-kr/Smart-India-Hackathon-2026"
      target="_blank"
      rel="noopener noreferrer"
      class="project-card"
    >
      <g transform="translate(606 370)">

        <!-- Row Box -->
        <rect
          class="card-rect"
          width="508"
          height="58"
          rx="16"
          fill="#0f172a"
          stroke="#1e293b"
          stroke-width="1.2"
        />

        <!-- Icon badge -->
        <circle cx="32" cy="29" r="18" fill="#00dfd8" fill-opacity="0.15" stroke="#00dfd8" stroke-opacity="0.5"/>
        <!-- Rocket / Innovation Vector Icon -->
        <g transform="translate(22 19)" fill="#00dfd8">
          <path d="M9.19 6.35c-2.04 2.29-3.44 5.58-3.57 5.89l4.14 4.14c.31-.13 3.6-1.53 5.89-3.57C17.5 11.16 19 8.28 19 3c-5.28 0-8.16 1.5-9.81 3.35zm3.74 3.72a2 2 0 1 1 2.83-2.83 2 2 0 0 1-2.83 2.83zM4 18l4-1-3-3-1 4zm1 2c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/>
        </g>

        <!-- Project Title -->
        <text
          x="62"
          y="24"
          fill="#f8fafc"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="14.5"
          font-weight="700"
        >
          Smart India Hackathon 2026
        </text>

        <!-- Tag badge -->
        <rect x="274" y="12" width="58" height="17" rx="5" fill="#00dfd8" fill-opacity="0.2"/>
        <text x="303" y="24" text-anchor="middle" fill="#00dfd8" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="600">SIH '26</text>

        <!-- Description -->
        <text
          x="62"
          y="43"
          fill="#94a3b8"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="12"
        >
          National hackathon initiative solving critical real-world challenges
        </text>

        <!-- External link arrow -->
        <g class="ext-arrow" transform="translate(476 21)" fill="#64748b">
          <path d="M5 2h9a1 1 0 0 1 1 1v9a1 1 0 1 1-2 0V5.414l-8.293 8.293a1 1 0 0 1-1.414-1.414L11.586 4H5a1 1 0 0 1 0-2z"/>
        </g>

      </g>
    </a>

  </g>

</svg>