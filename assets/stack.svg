<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="520"
     viewBox="0 0 1200 520"
     role="img"
     aria-label="Abhishek Kumar dynamic technology stack">

  <defs>

    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#247bff"/>
      <stop offset=".55" stop-color="#425eff"/>
      <stop offset="1" stop-color="#ff354f"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop stop-color="#247bff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#247bff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots"
             width="18"
             height="18"
             patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8da0c2" opacity=".15"/>
    </pattern>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <style>
      .bg {
        fill:#070b16;
      }

      .display {
        font-family:Arial,Helvetica,sans-serif;
        font-weight:700;
        fill:#f7f8fb;
      }

      .txt {
        font-family:Arial,Helvetica,sans-serif;
        fill:#f7f8fb;
      }

      .muted {
        fill:#aab3c4;
      }

      .blue {
        fill:#247bff;
      }

      .red {
        fill:#ff354f;
      }

      .chip {
        fill:#101a2e;
        stroke:#263149;
        stroke-width:1;
      }

      .chipText {
        font-family:Arial,Helvetica,sans-serif;
        font-size:13px;
        fill:#f7f8fb;
      }

      /* Entrance */
      .entrance {
        animation:
          entrance 1s cubic-bezier(.2,.75,.25,1) both;
      }

      .delay1 {
        animation-delay:.15s;
      }

      .delay2 {
        animation-delay:.3s;
      }

      .delay3 {
        animation-delay:.45s;
      }

      @keyframes entrance {
        from {
          opacity:0;
          transform:translateY(20px);
        }

        to {
          opacity:1;
          transform:translateY(0);
        }
      }

      /* Orbit rotation */
      .orbit1 {
        transform-origin:410px 275px;
        animation:rotate1 18s linear infinite;
      }

      .orbit2 {
        transform-origin:410px 275px;
        animation:rotate2 13s linear infinite;
      }

      .orbit3 {
        transform-origin:410px 275px;
        animation:rotate3 9s linear infinite;
      }

      @keyframes rotate1 {
        from {
          transform:rotate(0deg);
        }

        to {
          transform:rotate(360deg);
        }
      }

      @keyframes rotate2 {
        from {
          transform:rotate(360deg);
        }

        to {
          transform:rotate(0deg);
        }
      }

      @keyframes rotate3 {
        from {
          transform:rotate(0deg);
        }

        to {
          transform:rotate(-360deg);
        }
      }

      /* Center pulse */
      .coreGlow {
        animation:pulse 2.4s ease-in-out infinite;
        transform-origin:410px 275px;
      }

      @keyframes pulse {
        0%,100% {
          opacity:.25;
          transform:scale(.85);
        }

        50% {
          opacity:.55;
          transform:scale(1.15);
        }
      }

      .core {
        animation:corePulse 2.4s ease-in-out infinite;
      }

      @keyframes corePulse {
        0%,100% {
          stroke-width:1.5;
        }

        50% {
          stroke-width:3;
        }
      }

      /* Floating chips */
      .float1 {
        animation:float1 3s ease-in-out infinite;
      }

      .float2 {
        animation:float2 4s ease-in-out infinite;
      }

      .float3 {
        animation:float3 3.5s ease-in-out infinite;
      }

      .float4 {
        animation:float4 4.5s ease-in-out infinite;
      }

      .float5 {
        animation:float5 3.8s ease-in-out infinite;
      }

      @keyframes float1 {
        0%,100% { transform:translate(0,0); }
        50% { transform:translate(0,-9px); }
      }

      @keyframes float2 {
        0%,100% { transform:translate(0,0); }
        50% { transform:translate(8px,7px); }
      }

      @keyframes float3 {
        0%,100% { transform:translate(0,0); }
        50% { transform:translate(-7px,-8px); }
      }

      @keyframes float4 {
        0%,100% { transform:translate(0,0); }
        50% { transform:translate(7px,-7px); }
      }

      @keyframes float5 {
        0%,100% { transform:translate(0,0); }
        50% { transform:translate(-7px,7px); }
      }

      /* Moving dots */
      .particle {
        fill:#247bff;
        animation:particleMove 4s linear infinite;
      }

      .particle.redParticle {
        fill:#ff354f;
        animation-duration:5s;
      }

      @keyframes particleMove {
        0% {
          opacity:0;
          transform:translateY(25px);
        }

        20% {
          opacity:1;
        }

        80% {
          opacity:1;
        }

        100% {
          opacity:0;
          transform:translateY(-25px);
        }
      }

      /* Right side rows */
      .row {
        animation:rowIn .8s ease both;
      }

      .row1 { animation-delay:.5s; }
      .row2 { animation-delay:.7s; }
      .row3 { animation-delay:.9s; }
      .row4 { animation-delay:1.1s; }
      .row5 { animation-delay:1.3s; }

      @keyframes rowIn {
        from {
          opacity:0;
          transform:translateX(25px);
        }

        to {
          opacity:1;
          transform:translateX(0);
        }
      }

      /* Active scan line */
      .scan {
        animation:scan 3s ease-in-out infinite;
      }

      @keyframes scan {
        0%,100% {
          opacity:.05;
          transform:translateY(0);
        }

        50% {
          opacity:.45;
          transform:translateY(260px);
        }
      }

      /* Status indicator */
      .status {
        animation:statusPulse 1.6s ease-in-out infinite;
      }

      @keyframes statusPulse {
        0%,100% {
          opacity:.35;
          r:4;
        }

        50% {
          opacity:1;
          r:7;
        }
      }

      @media (prefers-reduced-motion:reduce) {
        * {
          animation:none!important;
        }
      }
    </style>
  </defs>

  <!-- BACKGROUND -->

  <rect width="1200"
        height="520"
        rx="34"
        class="bg"/>

  <rect width="1200"
        height="520"
        fill="url(#dots)"/>

  <circle cx="410"
          cy="275"
          r="250"
          fill="url(#glow)"
          opacity=".25"/>

  <!-- HEADER -->

  <g class="entrance">

    <text x="70"
          y="70"
          class="display"
          font-size="42">
    TECH STACK / ORBITS
    </text>

    <text x="70"
          y="98"
          class="txt muted"
          font-size="14">
      The tools I use across frontend, backend, cloud, data and AI.
    </text>

  </g>

  <!-- ANIMATED SCAN -->

  <rect x="50"
        y="120"
        width="700"
        height="2"
        fill="url(#grad)"
        opacity=".08"
        class="scan"/>

  <!-- ORBITS -->

  <g class="orbit1">

    <ellipse cx="410"
             cy="275"
             rx="310"
             ry="92"
             fill="none"
             stroke="#247bff"
             stroke-width="2"
             opacity=".65"
             transform="rotate(-10 410 275)"/>

  </g>

  <g class="orbit2">

    <ellipse cx="410"
             cy="275"
             rx="245"
             ry="72"
             fill="none"
             stroke="#ff354f"
             stroke-width="2"
             opacity=".55"
             transform="rotate(24 410 275)"/>

  </g>

  <g class="orbit3">

    <ellipse cx="410"
             cy="275"
             rx="180"
             ry="55"
             fill="none"
             stroke="#8da0c2"
             stroke-width="1.5"
             opacity=".6"
             transform="rotate(-34 410 275)"/>

  </g>

  <!-- GLOWING CORE -->

  <circle cx="410"
          cy="275"
          r="95"
          fill="url(#glow)"
          filter="url(#strongGlow)"
          class="coreGlow"/>

  <circle cx="410"
          cy="275"
          r="72"
          fill="#0b1120"
          stroke="url(#grad)"
          class="core"/>

  <text x="410"
        y="266"
        class="display"
        font-size="26"
        text-anchor="middle">
    FULL
  </text>

  <text x="410"
        y="297"
        class="display"
        font-size="26"
        text-anchor="middle">
    STACK
  </text>

  <circle cx="410"
          cy="323"
          r="4"
          fill="#247bff"
          class="status"/>

  <!-- TECH CHIP 1 -->
  <g class="float1 entrance delay1">

    <rect x="140"
          y="240"
          width="112"
          height="34"
          rx="17"
          class="chip"
          stroke="#247bff"/>

    <text x="196"
          y="262"
          text-anchor="middle"
          class="chipText">
      React / Vite
    </text>

  </g>

  <!-- TECH CHIP 2 -->

  <g class="float2 entrance delay2">

    <rect x="570"
          y="125"
          width="112"
          height="34"
          rx="17"
          class="chip"
          stroke="#ff354f"/>

    <text x="626"
          y="147"
          text-anchor="middle"
          class="chipText">
      Python
    </text>

  </g>

  <!-- TECH CHIP 3 -->

  <g class="float3 entrance delay3">

    <rect x="570"
          y="365"
          width="112"
          height="34"
          rx="17"
          class="chip"
          stroke="#247bff"/>

    <text x="626"
          y="387"
          text-anchor="middle"
          class="chipText">
      AWS
    </text>

  </g>

  <!-- TECH CHIP 4 -->

  <g class="float4 entrance delay1">

    <rect x="365"
          y="425"
          width="120"
          height="34"
          rx="17"
          class="chip"
          stroke="#ff354f"/>

    <text x="421"
          y="447"
          text-anchor="middle"
          class="chipText">
      MongoDB
    </text>

  </g>

  <!-- TECH CHIP 5 -->

  <g class="float5 entrance delay2">

    <rect x="115"
          y="365"
          width="112"
          height="34"
          rx="17"
          class="chip"
          stroke="#247bff"/>

    <text x="171"
          y="387"
          text-anchor="middle"
          class="chipText">
      Docker
    </text>

  </g>

<g class="float6 entrance delay2">

    <rect x="570"
          y="250"
          width="112"
          height="34"
          rx="17"
          class="chip"
          stroke="#ff354f"/>

    <text x="626"
          y="270"
          text-anchor="middle"
          class="chipText">
      JAVA
    </text>

  </g>

  <!-- PARTICLES -->

  <circle cx="110" cy="190" r="3" class="particle"/>
  <circle cx="290" cy="130" r="2" class="particle redParticle"/>
  <circle cx="510" cy="180" r="3" class="particle"/>
  <circle cx="700" cy="280" r="2" class="particle redParticle"/>
  <circle cx="300" cy="410" r="2" class="particle"/>
  <circle cx="530" cy="390" r="3" class="particle redParticle"/>

  <!-- RIGHT PANEL -->

  <g transform="translate(770 140)">

    <text class="txt blue"
          font-size="12">
      GROUPED CHIPS
    </text>

    <!-- FRONTEND -->

    <g class="row row1">

      <rect x="0"
            y="24"
            width="140"
            height="34"
            rx="17"
            class="chip"/>

      <text x="70"
            y="46"
            text-anchor="middle"
            class="chipText">
        Frontend
      </text>

      <text x="160"
            y="46"
            class="txt"
            font-size="14">
        React · Tailwind CSS · JS · Vite · Tree.js
      </text>

    </g>

    <!-- BACKEND -->

    <g class="row row2">

      <rect x="0"
            y="76"
            width="140"
            height="34"
            rx="17"
            class="chip"/>

      <text x="70"
            y="98"
            text-anchor="middle"
            class="chipText">
        Backend
      </text>

      <text x="160"
            y="98"
            class="txt"
            font-size="14">
        Node · Flask / Django · Python · Java · Spring Boot
      </text>

    </g>

    <!-- DATA -->

    <g class="row row3">

      <rect x="0"
            y="128"
            width="140"
            height="34"
            rx="17"
            class="chip"/>

      <text x="70"
            y="150"
            text-anchor="middle"
            class="chipText">
        Database
      </text>

      <text x="160"
            y="150"
            class="txt"
            font-size="14">
        Postgres · MySQL · SQL · MongoDB · Firebase
      </text>

    </g>

    <!-- AI / CLOUD -->

    <g class="row row4">

      <rect x="0"
            y="180"
            width="140"
            height="34"
            rx="17"
            class="chip"/>

      <text x="70"
            y="202"
            text-anchor="middle"
            class="chipText">
        AI / Cloud
      </text>

      <text x="160"
            y="202"
            class="txt"
            font-size="14">
        Google APIs · GCP · AWS · Azure · Stitch
      </text>

    </g>

    <!-- TOOLING -->

    <g class="row row5">

      <rect x="0"
            y="232"
            width="140"
            height="34"
            rx="17"
            class="chip"/>

      <text x="70"
            y="254"
            text-anchor="middle"
            class="chipText">
        Tooling
      </text>

      <text x="160"
            y="254"
            class="txt"
            font-size="14">
        Git · Linux · Postman · Arduino · Docker
      </text>

    </g>

  </g>

  <!-- BOTTOM STATUS -->

  <g class="entrance delay3">

    <line x1="770"
          y1="440"
          x2="1120"
          y2="440"
          stroke="#263149"/>

    <circle cx="790"
            cy="440"
            r="5"
            fill="#247bff"
            class="status"/>

    <text x="805"
          y="445"
          class="txt muted"
          font-size="12">
      SYSTEM ONLINE
    </text>

    <text x="1120"
          y="445"
          text-anchor="end"
          class="txt blue"
          font-size="12">
      BUILD · LEARN · EXPERIMENT · EXPLORE
    </text>

  </g>

</svg>
